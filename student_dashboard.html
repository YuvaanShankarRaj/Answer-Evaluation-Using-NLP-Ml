<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 0;
            color: white;
        }

        .nav-links a {
            margin: 5px 10px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Hero */
        .hero {
            margin-top: 30px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 700px;
            color: white;
        }

        /* Container */
        .container {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Inputs */
        input[type="file"] {
            width: 90%;
            margin-top: 10px;
        }

        /* Buttons */
        button {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            width: 100%;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 0;
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h1>EduAI Platform</h1>
        <div class="nav-links">
            <a href="/logout"><button>Home</button></a>
        </div>
    </div>

    <!-- Hero -->
    <div class="hero">
        <h2>Student Dashboard</h2>
        <p>
            Upload your answer sheet images for AI-based evaluation.
            Get quick and accurate feedback to improve your performance.
        </p>
    </div>

    <!-- Upload Form -->
    <div class="container">

        <h2>Upload Answer Sheet Images</h2>

        <form action="/upload_student_answers" method="POST" enctype="multipart/form-data">

            <input type="file" name="images" multiple required>

            <br><br>

            <button type="submit" onclick="studentUploadedAnswers()">
                Upload Answers
                <script>
                    function studentUploadedAnswers(){
                        alert("Student Answer Uploaded Successfully");
                    }
                </script>
            </button>

        </form>

        <br>

        <a href="/logout">
            <button>Logout</button>
        </a>

    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 EduAI Platform | Empowering Education with AI</p>
    </div>

</body>

</html>
